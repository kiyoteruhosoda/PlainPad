name: Flutter Build

on:
  workflow_run:
    workflows: ["Auto Version Bump"]
    types:
      - completed

concurrency:
  group: flutter-build
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The Flutter this app is built with. See the "Install Flutter" step for
  # why it is pinned here rather than taken from the runner image.
  FLUTTER_VERSION: 3.27.4

jobs:
  start-runner:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.FUNC_URL }}" ]        && MISSING="$MISSING FUNC_URL"
          [ -z "${{ secrets.FUNC_STOP_URL }}" ]   && MISSING="$MISSING FUNC_STOP_URL"
          [ -z "${{ secrets.FUNC_STATUS_URL }}" ] && MISSING="$MISSING FUNC_STATUS_URL"
          if [ -n "$MISSING" ]; then
            echo "ERROR: The following required secrets are not set:$MISSING"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Stop any existing ACI Runner
        run: |
          echo "Stopping any previously running ACI runner..."
          curl -s -X POST "${{ secrets.FUNC_STOP_URL }}" || true
          sleep 5

      - name: Start ACI Runner
        run: |
          for ATTEMPT in 1 2 3 4; do
            echo "--- Start attempt $ATTEMPT ---"
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "${{ secrets.FUNC_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"github_repo\": \"${{ github.repository }}\"}" || true)

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -1)
            echo "Response: $BODY"
            echo "HTTP Status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "ACI Runner started successfully."
              exit 0
            fi

            if [ "$ATTEMPT" -lt 4 ]; then
              WAIT=$((2 ** ATTEMPT))
              echo "Start failed (HTTP $HTTP_CODE). Retrying in ${WAIT}s..."
              sleep "$WAIT"
              echo "Stopping runner before retry..."
              curl -s -X POST "${{ secrets.FUNC_STOP_URL }}" || true
              sleep 5
            fi
          done

          echo "Failed to start ACI Runner after 4 attempts."
          exit 1

      - name: Wait and monitor ACI
        run: |
          STATUS_URL="${{ secrets.FUNC_STATUS_URL }}"

          for i in $(seq 1 20); do
            echo "--- Attempt $i ---"
            RESULT=$(curl -s "$STATUS_URL" || true)
            STATUS=$(echo $RESULT | jq -r '.status')
            LOGS=$(echo $RESULT | jq -r '.logs')

            echo "ACI Status: $STATUS"
            echo "--- ACI Logs ---"
            echo "$LOGS"

            if [ "$STATUS" = "Terminated" ]; then
              EXIT_CODE=$(echo $RESULT | jq -r '.exit_code')
              echo "ACI terminated with exit code: $EXIT_CODE"
              if [ "$EXIT_CODE" != "0" ]; then
                exit 1
              fi
            fi

            if echo "$LOGS" | grep -q "Listening for Jobs"; then
              echo "Runner is ready!"
              exit 0
            fi

            sleep 15
          done

          echo "Timeout waiting for runner"
          exit 1

  build:
    needs: start-runner
    # ⚠ This job runs on the ACI runner, which is on runner 2.317.0 — it only
    #   understands `using:` docker / node12 / node16 / node20. Every action
    #   here is therefore pinned to its last node20 major (v4). The @v5
    #   majors declare `using: node24` and the runner refuses to load them,
    #   failing "Set up job" before checkout — which is how every build since
    #   2026-04-26 died, artifacts and all.
    #   `FORCE_JAVASCRIPT_ACTIONS_TO_NODE24` above does not help: it picks
    #   which node a node20 action runs on, it does not teach an old runner a
    #   `using:` it has never heard of.
    #   Move these back to @v5 once the runner image ships 2.327 or newer.
    #   The jobs on ubuntu-latest are GitHub-hosted and stay on @v5.
    runs-on: [self-hosted, flutter, android]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0  # Full history needed for git rev-list --count
      - name: Setup Android SDK permissions
        run: |
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            sudo chmod -R a+rwx "$ANDROID_SDK_ROOT" || true
          elif [ -n "$ANDROID_HOME" ]; then
            sudo chmod -R a+rwx "$ANDROID_HOME" || true
          fi
      # ⚠ Do not use the image's own Flutter. It is 3.22 (Dart 3.4.3), which
      #   is too old for this app in two separate ways:
      #     - `flutter pub get` cannot even resolve: riverpod_generator pulls
      #       an analyzer that wants meta ^1.14, and Flutter 3.22 pins meta
      #       to 1.12.0.
      #     - the app does not compile: `Color.withValues`
      #       (lib/presentation/pages/system/logs_page.dart) needs 3.27, and
      #       `PopScope.onPopInvokedWithResult` (main_page, editor_page)
      #       needs 3.24.
      #   ⚠ It is a window, not a floor: from 3.29 `ThemeData.cardTheme`
      #     takes a `CardThemeData` and lib/shared/theme/app_theme.dart stops
      #     compiling, so do not move this to `stable`. Widening the window
      #     means migrating that file first.
      #   Pinning here rather than in the image also puts the version in git,
      #   where a reviewer can see it — the image is built from a Dockerfile
      #   uploaded by hand to func-flutter-build's /api/upload-and-build.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          set -euo pipefail
          archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$archive"
          rm -rf "$RUNNER_TEMP/flutter"
          tar -xf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          # Prepended, so it wins over the Flutter baked into the image.
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version check
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get
      - name: Generate build info
        run: bash scripts/generate_build_info.sh
      - name: Setup release signing
        env:
          KEYSTORE_BASE64:  ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS:        ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:     ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD:   ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=../app/release.keystore"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Release signing configured."
          else
            echo "KEYSTORE_BASE64 not set — using debug signing (dev/test only)."
          fi
      - name: Flutter build APK
        run: flutter build apk --release --build-number=$(git rev-list --count HEAD)
      - name: Flutter build AAB
        run: flutter build appbundle --release --build-number=$(git rev-list --count HEAD)
      # Upload the per-app renamed copies written by android/app/build.gradle
      # (see docs/CUSTOMISATION.md §9c).  We exclude the generic
      # app-release.{apk,aab} that Flutter CLI requires to stay put.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            !build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: |
            build/app/outputs/bundle/release/*-release.aab
            !build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  stop-runner:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Stop ACI
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.FUNC_STOP_URL }}" || true)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"
